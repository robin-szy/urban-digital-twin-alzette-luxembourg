services:
  backend:
    user: root
    volumes:
      - ../../eddie_aoi/eddie_aoi:/venv/lib/python3.11/site-packages/eddie_aoi:ro
      - ../../eddie_alzette_ingest/eddie_alzette_ingest:/venv/lib/python3.11/site-packages/eddie_alzette_ingest:ro
      - ../../eddie_precip_interpolation/eddie_precip_interpolation:/venv/lib/python3.11/site-packages/eddie_precip_interpolation:ro
      - ../../eddie_water_level/eddie_water_level:/venv/lib/python3.11/site-packages/eddie_water_level:ro
      - ../../data_sources:/app/data_sources:ro
      - ./src/static/geo:/app/src/static/geo:ro
      - ../../data/raw/River_kilometers:/app/data/river_kilometers:ro
      - ../../eddie_buildings/eddie_buildings:/venv/lib/python3.11/site-packages/eddie_buildings:ro
      - ../../data/raw/Buildings:/app/data/buildings:ro
      - ./data/terrain:/app/data/terrain:ro
      # Relative Elevation Model cache (eddie_water_level.rem), built once from the DEM; writable
      - ./data/rem:/app/data/rem
      - ../../data/raw/Flood_hazard:/app/data/flood_hazard:ro
      - ../../data/raw/Communes:/app/data/communes:ro
      - ../../eddie_building_population/eddie_building_population:/venv/lib/python3.11/site-packages/eddie_building_population:ro
      - ../../eddie_flood_costs/flood_costs:/venv/lib/python3.11/site-packages/eddie_flood_costs:ro
    environment:
      - DATA_SOURCES_DIR=/app/data_sources
      - RIVER_KILOMETRAGE_GPKG=/app/data/river_kilometers/kilometrage-des-cours-deau.gpkg
      # Must equal the --height-offset given to scripts/prepare_dem.py
      - TERRAIN_HEIGHT_OFFSET=${TERRAIN_HEIGHT_OFFSET:-0}
      # Metres the water drawn from gauge levels is raised (water_surface.py)
      - WATER_RENDER_OFFSET=${WATER_RENDER_OFFSET:-0}
      # Minimum metres of water above the displayed terrain, inside the river channel only (grid method only)
      - CHANNEL_MARGIN=${CHANNEL_MARGIN:-0.05}
      # Gauge-stage step (cm) of the precomputed water levels (flood_grid.py)
      - WATER_LEVEL_STEP_CM=${WATER_LEVEL_STEP_CM:-10}
      # Cell size (m) of the drawn water mesh; 1 removes the <= 1 m channel-edge fringe, at 4x the data
      - WATER_MESH_M=${WATER_MESH_M:-2}
      # Velocity estimate: Manning roughness and slope smoothing distance (m)
      - MANNING_N=${MANNING_N:-0.035}
      - SLOPE_SMOOTHING_M=${SLOPE_SMOOTHING_M:-300}
      # Brown shading of steep terrain: starts at / full colour from (degrees)
      - SLOPE_SHADING_START_DEG=${SLOPE_SHADING_START_DEG:-25}
      - SLOPE_SHADING_FULL_DEG=${SLOPE_SHADING_FULL_DEG:-60}
      # OpenStreetMap extract: river channel and place names
      - OSM_GPKG=/app/data/buildings/luxembourg.gpkg
      - BUILDINGS_GPKG=/app/data/buildings/ACT2023v2_Buildings3d_Footprints.gpkg
      - TERRAIN_DEM=/app/data/terrain/dem_merged.tif
      # 3D terrain: the LiDAR DEM with ellipsoid heights (NG95 + EGM2008), built once by
      # scripts/build_lidar_terrain.sh; the geoid grid it used places water and buildings on it
      - TERRAIN_DATA_DIR=/app/data/terrain/lidar_egm2008/terrain
      - TERRAIN_GEOID_GRID=/app/data/terrain/lidar_egm2008/geoid_egm2008.tif
      # Water surface: "sections" (tilted sections along the river) or "grid" (the earlier grid surface)
      - WATER_SURFACE_METHOD=${WATER_SURFACE_METHOD:-sections}
      # Half-width (m) of the band the water sections cover; 700 holds the HQextreme extent
      - SECTION_CORRIDOR_M=${SECTION_CORRIDOR_M:-700}
      # Water of gauge levels (live, replay, manual): "rem" (Relative Elevation Model) or "sections"
      # (WATER_SURFACE_METHOD, the tilted sections); the flood scenarios always use WATER_SURFACE_METHOD
      - LIVE_WATER_METHOD=${LIVE_WATER_METHOD:-rem}
      - REM_CACHE_DIR=/app/data/rem
      # Smallest water rise (m) above the REM base surface, so the channel stays filled at low stages
      - REM_MIN_RISE_M=${REM_MIN_RISE_M:-0.15}
      # Height in metres given to the 3D buildings without height data
      - BUILDING_HEIGHT_M=${BUILDING_HEIGHT_M:-10}

  gauge_collector:
    # Fetches Alzette gauge readings from heichwaasser.lu into water_level_history (gauge_collector/README.md)
    build:
      context: .
      dockerfile: docker/eddie.Dockerfile
    container_name: gauge_collector_digital_twin
    entrypoint: ["/venv/bin/python", "-m", "gauge_collector"]
    command: ["serve"]
    env_file:
      - .env
      - .env.docker-override
    environment:
      - PYTHONPATH=/opt/gauge_collector
      # Minutes between incremental runs while the service is up (0 = off)
      - COLLECT_INTERVAL_MIN=${COLLECT_INTERVAL_MIN:-15}
    volumes:
      - ../../gauge_collector:/opt/gauge_collector:ro
    ports:
      - "5002:5002"
    depends_on:
      - db_postgres

  celery_worker:
    volumes:
      - ../../eddie_aoi/eddie_aoi:/venv/lib/python3.11/site-packages/eddie_aoi:ro
      - ../../eddie_alzette_ingest/eddie_alzette_ingest:/venv/lib/python3.11/site-packages/eddie_alzette_ingest:ro
      - ../../eddie_precip_interpolation/eddie_precip_interpolation:/venv/lib/python3.11/site-packages/eddie_precip_interpolation:ro
      - ../../eddie_water_level/eddie_water_level:/venv/lib/python3.11/site-packages/eddie_water_level:ro
      - ../../data_sources:/app/data_sources:ro
      - ./src/static/geo:/app/src/static/geo:ro
      - ../../eddie_building_population/eddie_building_population:/venv/lib/python3.11/site-packages/eddie_building_population:ro
      - ../../eddie_flood_costs/flood_costs:/venv/lib/python3.11/site-packages/eddie_flood_costs:ro
      # Inputs of the two tasks above
      - ../../data/raw/River_kilometers:/app/data/river_kilometers:ro
      - ../../data/raw/Buildings:/app/data/buildings:ro
      - ../../data/raw/Flood_hazard:/app/data/flood_hazard:ro
      - ./data/terrain:/app/data/terrain:ro
      # Writable: population_model.py sets SHAPE_RESTORE_SHX=YES, so GDAL opens the commune shapefile for update
      - ../../data/raw/Population:/app/data/population
      # Flood-cost inputs (JRC workbook, reviewed classifications) and runs/; writable for the runs
      - ../../data/flood_costs:/app/data/flood_costs
    environment:
      - DATA_SOURCES_DIR=/app/data_sources
      - RIVER_KILOMETRAGE_GPKG=/app/data/river_kilometers/kilometrage-des-cours-deau.gpkg
      # eddie_building_population: BU.Building.gml, LU00.gpkg, LIMADM_COMMUNES.shp, rnpp_population_per_municipality.csv
      - POPULATION_DATA_DIR=/app/data/population
      # eddie_flood_costs (README "Dependencies and configuration")
      - FLOOD_COSTS_PROJECT_ROOT=/app/data/flood_costs
      - FLOOD_COSTS_RUNS_DIR=/app/data/flood_costs/runs
      - FLOOD_COSTS_GDAL_LIBRARY=/venv/lib/libgdal.so
      - FLOOD_COSTS_INPUT_DEM=/app/data/terrain/dem_merged.tif
      - FLOOD_COSTS_INPUT_BUILDINGS=/app/data/buildings/ACT2023v2_Buildings3d_Footprints.gpkg
      - FLOOD_COSTS_INPUT_MARKERS=/app/data/river_kilometers/kilometrage-des-cours-deau.gpkg
      - FLOOD_COSTS_INPUT_HQ10=/app/data/flood_hazard/hwgk2021-hq10.geojson
      - FLOOD_COSTS_INPUT_HQ100=/app/data/flood_hazard/hwgk2021-hq100.geojson
      - FLOOD_COSTS_INPUT_LANDUSE=/app/src/static/geo/alzette_35_50_landuse_ownership.geojson
      - FLOOD_COSTS_INPUT_JRC_WORKBOOK=/app/data/flood_costs/inputs/jrc/copy_of_global_flood_depth-damage_functions__30102017.xlsx
      # Devika's human-reviewed OSM classifications (not recomputed here)
      - FLOOD_COSTS_STAGE_OSM=/app/data/flood_costs/inputs/osm_classification

  celery_beat:
    volumes:
      - ../../eddie_alzette_ingest/eddie_alzette_ingest:/venv/lib/python3.11/site-packages/eddie_alzette_ingest:ro
      - ../../eddie_precip_interpolation/eddie_precip_interpolation:/venv/lib/python3.11/site-packages/eddie_precip_interpolation:ro
      - ../../eddie_water_level/eddie_water_level:/venv/lib/python3.11/site-packages/eddie_water_level:ro
      - ../../data_sources:/app/data_sources:ro
    environment:
      - DATA_SOURCES_DIR=/app/data_sources

  message_broker:
    # A host-installed redis-server already listens on 127.0.0.1:6379, so the
    # default "6379:6379" publish fails with "address already in use".
    #
    # Nothing in the stack needs the broker on the host: .env.docker-override
    # points every service at MESSAGE_BROKER_HOST=message_broker, resolved over
    # the compose network. The publish only ever served host-side debugging.
    # For that, swap this for - "6380:6379" (6379 is taken by the host redis).
    ports: !reset []
