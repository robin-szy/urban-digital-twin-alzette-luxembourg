services:
  backend:
    user: root
    volumes:
      - ../../eddie_aoi/eddie_aoi:/venv/lib/python3.11/site-packages/eddie_aoi:ro
      - ../../eddie_alzette_ingest/eddie_alzette_ingest:/venv/lib/python3.11/site-packages/eddie_alzette_ingest:ro
      - ../../eddie_precip_interpolation/eddie_precip_interpolation:/venv/lib/python3.11/site-packages/eddie_precip_interpolation:ro
      - ../../eddie_water_level/eddie_water_level:/venv/lib/python3.11/site-packages/eddie_water_level:ro
      - ../../data_sources:/app/data_sources:ro
      - ./src/static/geo:/app/src/static/geo:ro
    environment:
      - DATA_SOURCES_DIR=/app/data_sources

  celery_worker:
    volumes:
      - ../../eddie_aoi/eddie_aoi:/venv/lib/python3.11/site-packages/eddie_aoi:ro
      - ../../eddie_alzette_ingest/eddie_alzette_ingest:/venv/lib/python3.11/site-packages/eddie_alzette_ingest:ro
      - ../../eddie_precip_interpolation/eddie_precip_interpolation:/venv/lib/python3.11/site-packages/eddie_precip_interpolation:ro
      - ../../eddie_water_level/eddie_water_level:/venv/lib/python3.11/site-packages/eddie_water_level:ro
      - ../../data_sources:/app/data_sources:ro
      - ./src/static/geo:/app/src/static/geo:ro
    environment:
      - DATA_SOURCES_DIR=/app/data_sources
  terria_map:
    volumes:
      # The image bakes client_config.json in at build time (and the build is
      # currently broken by a missing date-selector.js), so the config is
      # mounted instead. config.generated.json is produced from the tracked
      # client_config.json with the $URL placeholders already filled, so the
      # entrypoint's in-place substitution cannot dirty the working tree.
      - ./terriajs/config.generated.json:/app/wwwroot/config.json
      - ./terriajs/catalog.generated.json:/app/wwwroot/init/catalog.json
