[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eddie_aoi"
version = "0.0.1"
description = "Alzette digital twin: the area-of-interest module. Resolves a river reach (river, km_start, km_end) to a validated centerline with chainage, derives named AOI variants from it, and binds each dataset to the variant it must be processed against."
requires-python = ">=3.11"
# Loose/minimum specifiers only - EDDIE's own environment.yml already pins
# exact versions for most of these; this file must not fight that when
# pip-installed into the same conda env.
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "pyogrio",
    "pyproj",
    "sqlalchemy>=2",
    "geoalchemy2",
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["eddie_aoi"]

[tool.pytest.ini_options]
markers = ["integration: needs a running PostGIS (db_postgres_digital_twin); not run by default"]
addopts = "-m 'not integration'"
